# Why two published figures differ, where it is known. Read by `module5`.
#
# The code finds every difference and labels rounding by itself; everything else is written here
# by hand, one entry per cause, only once the evidence is saved and cited (a key in
# references.bib). A difference with no entry reads "not known yet" on the site: an explanation
# is never guessed. Categories: revision, rebasing, splice, definition.
#
#   check     the check's id (module5)
#   periods   the periods it explains, "YYYY-MM" or "YYYY"
#   category  one of the categories above
#   evidence  the references.bib key that shows it
#   finding   the site's page for it, a slug under the check

# June 2001 in table 05: when the table was rebased to 2020 = 100 (between the copies of
# July 2021 and November 2022), June 2000's index alone moved, by +0.009%, and its own rate was
# recomputed; June 2001's rate, which compares with June 2000, was not. Every copy from 2010 to
# 2021 has June 2001's rate equal to its index ratio.
[[explanation]]
check = "gr-cpi-rates-own-index"
periods = ["2001-06"]
category = "revision"
evidence = "elstat-cpi-rates-history"
finding = "june-2001"

# Table 07's overall index against table 05's rates, 2014-2024: in February 2026 ELSTAT re-issued
# every table 07 file in COICOP 2018 (2010-2025, all saved on 2026-02-02); the re-issue keeps the
# all-items index "unchanged up to the second decimal place" (ELSTAT's note of 2026-02-10) but
# moved it beyond that for 2014-2023 (-33 to +15 parts per million), and 2024's December-2023
# link month with it. Table 05 kept the series as first published. Every earlier table 07 version
# found matches table 05 exactly. September 2015 (and its mirror, September 2016) differ more:
# the re-issue changed that month's garments index; why is not known (the finding page says so).
# Evidence: ELSTAT's note, and past versions of table 07 kept by the Internet Archive's Wayback
# Machine (archived as elstat/cpi07-wayback).
