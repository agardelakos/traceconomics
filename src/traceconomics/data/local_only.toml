# Archive datasets that hold microdata (one record per household or person) and must
# stay on machines the owner controls: not published, not synced to any cloud or shared
# storage, not attached to a release. Only aggregates computed from them may be.
#
# Patterns are source/dataset; a trailing * matches any dataset with that prefix.
# Every step that publishes or copies the archive anywhere must call
# traceconomics.archive.local_only.check() first, and it refuses these.

patterns = [
    "elstat/puf-*",       # ELSTAT public use files: HBS, LFS, SILC, energy survey
]

# Matches of the patterns above that are not microdata. Kept short and explicit: the broad
# pattern is the safe default, so a new microdata file with a new name is still caught.
exceptions = [
    "elstat/puf-catalogue",   # the public web page listing the files
]
