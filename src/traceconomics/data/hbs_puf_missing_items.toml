# Items that ELSTAT's household budget survey public use files (PUF) leave out, or include only
# in part, compared with ELSTAT's published table 1.03 ("absent": no column in the PUF;
# "cut": the PUF figure is lower than the published one).
#
# Found by rebuilding table 1.03 from the PUF for every year 2008-2024 (all households,
# purchases, codes up to 5 digits) on 2026-10-18; consistent with the earlier research
# check of 2026-10-14. Together they are 5.1-6.4% of purchases in 2008-2014, 2.6-3.6% in
# 2015-2023 and 1.2% in 2024 (`traceconomics check v2`, 2026-10-19). Why ELSTAT removes them
# is not stated (assumed: disclosure control).
#
# Codes are each survey's own: national COICOP 1999 codes up to 2023, COICOP 2018 in 2024.
# A total that contains a listed item (its parents, and code 00) differs too and is
# excused with it. 2014, 2015 and 2018 are listed for completeness; those years are not
# checked strictly, because their PUF weights differ from the published tables.

[items."04711"]
label = "Lighting of roads, squares etc. (municipal); labelled 'Mortgage' in the 2015-2017 tables"
kind = "absent"
years = [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

