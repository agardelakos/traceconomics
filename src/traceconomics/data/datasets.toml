# Source datasets that are parsed into the observation store.
#
# Each entry names:
#   archive       the archive dataset(s) that feed it, as source/dataset; a trailing *
#                 matches any dataset with that prefix (filtered further by `file_name`)
#   format        which parser reads it
#   dimensions    the series key, in the source's own order (this order is fixed:
#                 it is used to build keys and file names)
#   coicop        the dimension holding spending categories, if any; its codes are
#                 stored without Eurostat's "CP" prefix, with all items as TOTAL
#   classification  which COICOP version those codes belong to
#   backcast_before  values for earlier periods were computed after the fact
#                 (a back series), not published at the time
#   release       the dimension telling flash from final values, if any
#   file_name     for archive patterns: a regular expression the archived file's
#                 original name must match
#   label_files   files read only for their labels (e.g. the Greek-language copies)

[eurostat.prc_hicp_minr]
archive = ["eurostat/prc_hicp_minr"]
format = "eurostat-tsv"
freq = "M"
dimensions = ["freq", "unit", "coicop18", "geo"]
coicop = "coicop18"
classification = "ecoicop2"
backcast_before = "2026-01"

[eurostat.prc_hicp_iw]
archive = ["eurostat/prc_hicp_iw"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "coicop18", "statinfo", "geo"]
coicop = "coicop18"
classification = "ecoicop2"
backcast_before = "2026"

[eurostat.prc_hicp_fpd]
archive = ["eurostat/prc_hicp_fpd"]
format = "eurostat-tsv"
freq = "M"
dimensions = ["freq", "unit", "coicop18", "release", "geo"]
coicop = "coicop18"
classification = "ecoicop2"
backcast_before = "2026-01"
release = "release"

# ECOICOP version 1, frozen since 2025-12: genuine values as published at the time.

[eurostat.prc_hicp_midx]
archive = ["eurostat/prc_hicp_midx"]
format = "eurostat-tsv"
freq = "M"
dimensions = ["freq", "unit", "coicop", "geo"]
coicop = "coicop"
classification = "ecoicop1"

[eurostat.prc_hicp_inw]
archive = ["eurostat/prc_hicp_inw"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "coicop", "geo"]
coicop = "coicop"
classification = "ecoicop1"

[eurostat.prc_hicp_fp]
archive = ["eurostat/prc_hicp_fp"]
format = "eurostat-tsv"
freq = "M"
dimensions = ["freq", "unit", "coicop", "release", "geo"]
coicop = "coicop"
classification = "ecoicop1"
release = "release"

# EU-SILC: each fifth's top income limit (statinfo TC) in euros and in purchasing power
# standards, per survey year (incomes of the year before). The site shows them next to ours.
[eurostat.ilc_di01]
archive = ["eurostat/ilc_di01"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "quant_inc", "statinfo", "unit", "geo"]

# ELSTAT CPI table 07: every item's monthly index and the year's weights, one
# document per year (2010 onward, re-issued in COICOP 2018 with 2020=100).
# freq A carries the weights (unit PM, per mille) and annual averages; freq M the
# monthly indices (unit I20, 2020=100). Values come from the English files.

[elstat.cpi07]
archive = ["elstat/doc-*"]
file_name = 'DKT87_TS_MM_01_\d{4}_\d\d_\d{4}_07_F_EN\.xlsx?$'
label_files = 'DKT87_TS_MM_01_\d{4}_\d\d_\d{4}_07_F_(EN|GR)\.xlsx?$'
format = "elstat-cpi07"
dimensions = ["freq", "unit", "coicop18", "geo"]
coicop = "coicop18"
classification = "coicop2018"

# ELSTAT's CPI table 05: the overall index and its published twelve-month rate of change, monthly
# from 1959, one file overwritten every month. Kept so ELSTAT's own rate can be compared with the
# one we compute from table 07. freq M: unit I20 the index (2020=100), RCH_A_FR the rate as the
# file holds it, a fraction (0.05 = 5%); freq A: the annual averages and their rates.
[elstat.cpi05]
archive = ["elstat/doc-*"]
file_name = 'DKT87_TS_MM_\d\d_1959_\d\d_\d{4}_05_F_EN\.xlsx$'
format = "elstat-cpi05"
dimensions = ["freq", "unit", "geo"]

# Our own weights tables, built locally from the household budget survey microdata (aggregates only).
["oet-local".hbs_weights]
archive = ["oet-local/hbs-weights-gr-*"]
format = "oet-weights"
freq = "A"
dimensions = ["geo", "grouping", "group", "spending", "imputed_rent", "hh_weighting", "tutoring", "coicop18", "measure"]
coicop = "coicop18"
classification = "coicop2018"

["oet-local".hbs_groups]
archive = ["oet-local/hbs-groups-gr-*"]
format = "oet-groups"
freq = "A"
dimensions = ["geo", "grouping", "group", "measure"]

["oet-local".hbs_limits]
archive = ["oet-local/hbs-limits-gr-*"]
format = "oet-limits"
freq = "A"
dimensions = ["geo", "grouping", "group", "unit", "measure"]

# Our household types next to ELSTAT's own (HB074), one file per survey year: a check of our
# rule against the office's, published by the consistency topic (module5), not by module1.
["oet-local".hbs_hhtypes]
archive = ["oet-local/hbs-hhtypes-gr-*"]
format = "oet-hhtypes"
freq = "A"
dimensions = ["geo", "group", "measure"]

# Rent paid for the main home by tenure, euros a year, one file per survey year: the survey's
# answer to "how much rent do households pay?", published by the consistency topic (module5).
["oet-local".hbs_rent]
archive = ["oet-local/hbs-rent-gr-*"]
format = "oet-rent"
freq = "A"
dimensions = ["geo", "tenure", "measure"]

# Our reading of the survey file against ELSTAT's published spending table (table 1.03), item by
# item and per band where the bands can be rebuilt, one file per survey year: the V2 check,
# published by the consistency topic (module5).
["oet-local".hbs_spending]
archive = ["oet-local/hbs-spending-gr-*"]
format = "oet-spending"
freq = "A"
dimensions = ["geo", "group", "coicop", "measure"]

# EU-SILC: tenure and rent paid, by household and person, one file per survey year, built locally
# from ELSTAT's SILC public use files (aggregates only), for the consistency topic.
["oet-local".silc_tenure]
archive = ["oet-local/silc-tenure-gr-*"]
format = "oet-silc-tenure"
freq = "A"
dimensions = ["geo", "tenure", "measure"]

["oet-local".hbs_bands]
archive = ["oet-local/hbs-bands-gr"]
format = "oet-bands"
dimensions = ["geo", "grouping", "group", "spending", "imputed_rent", "price_source", "weights_timing", "tutoring", "unit", "measure"]

# "Same question, different sources" (the consistency topic): each official answer to one question,
# lined up with its definition. Shown as published, never used to compute another source's figure.

# Rent paid by households (CP041, actual rentals for housing) and imputed rent (CP042), in the
# national accounts' household consumption by purpose (COICOP 1999 codes, kept as Eurostat writes
# them: not a classification this package maps, so no `coicop` key).
[eurostat.nama_10_co3_p3]
archive = ["eurostat/nama_10_co3_p3"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "unit", "coicop", "geo"]

# Household income in the sector accounts: B6G, gross disposable income of households and the
# non-profits serving them (sector S14_S15).
[eurostat.nasa_10_nf_tr]
archive = ["eurostat/nasa_10_nf_tr"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "unit", "direct", "na_item", "sector", "geo"]

# EU-SILC: the population by tenure (persons), and mean and median income.
[eurostat.ilc_lvho02]
archive = ["eurostat/ilc_lvho02"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "rskpovth", "hhcomp", "tenure", "unit", "geo"]

[eurostat.ilc_di03]
archive = ["eurostat/ilc_di03"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "age", "sex", "statinfo", "unit", "geo"]

# Labour force survey: unemployment (ILO definition), monthly and annual.
[eurostat.une_rt_m]
archive = ["eurostat/une_rt_m"]
format = "eurostat-tsv"
freq = "M"
dimensions = ["freq", "s_adj", "age", "unit", "sex", "geo"]

[eurostat.une_rt_a]
archive = ["eurostat/une_rt_a"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "age", "unit", "sex", "geo"]

# The censuses' private households by tenure: 2011 (by household type, NUTS 2) and 2021 (by
# household composition, NUTS 3). Each country's total is its own row.
[eurostat.cens_11htts_r2]
archive = ["eurostat/cens_11htts_r2"]
format = "eurostat-tsv"
freq = "A"
regions = true
dimensions = ["freq", "hhcomp", "tenure", "unit", "geo"]

[eurostat.cens_21hhct_r3]
archive = ["eurostat/cens_21hhct_r3"]
format = "eurostat-tsv"
freq = "A"
regions = true
dimensions = ["freq", "tenure", "hhcomp", "unit", "geo"]

# The register: people registered with the public employment services (DG EMPL's LMP database,
# annual average stock), beside the labour force survey's unemployed.
["ec-empl".lmp_rjru]
archive = ["ec-empl/lmp_rjru"]
format = "eurostat-tsv"
freq = "A"
dimensions = ["freq", "unit", "stk_flow", "regis_es", "age", "sex", "geo"]

# AADE's yearly personal income tax statistics, table 1: its own national totals (returns,
# declared income and its sources), shown as published (its terms forbid modifying them). Only
# workbooks in the layout checked (tax years 2019-2022) feed the store; older ones stay archived.
[aade.pit_stats]
archive = ["aade/pit-*"]
file_name = '^(SD_FP_\d\dF_\d+|etisio_stats_fysikwn_forologikou_\d{4}[^/]*)\.xlsx$'
format = "aade-pit"
freq = "A"
dimensions = ["freq", "unit", "measure", "geo"]
