[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "traceconomics"
version = "0.1.0"
description = "An open, transparent economy tracker built only on public data."
readme = "README.md"
license = "Apache-2.0"
# NOTICE travels with every copy of the code, as Apache-2.0 section 4(d) asks.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
# Pinned exactly: this is an application, and reproducible runs matter more than flexibility.
dependencies = [
    "duckdb==1.5.6",
    "keyring==25.7.0",
    "openpyxl==3.1.5",
    "tzdata==2026.5",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "coverage==7.17.0", "ruff==0.17.3"]
# Only for the microdata code that runs on the owner's machine (src/traceconomics/local); never needed to
# use the published data.
local = ["pandas==3.0.6", "py7zr==1.1.4", "pyxlsb==1.0.10"]
# Only for the Selenium browser tests in tests/selenium (run with `pytest tests/selenium --selenium`).
selenium = ["selenium==4.51.0", "pytest-xdist==3.8.0"]

[project.scripts]
traceconomics = "traceconomics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traceconomics.data" = ["*.toml", "*.csv"]
"traceconomics.references" = ["*.bib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "smoke: Selenium browser tests that also run against a deployed copy",
    "host: Selenium browser tests that need a server applying the site's headers (--base-url)",
    # The layers: every test has exactly one (tests/conftest.py says what each means and checks it).
    "unit: one component on its own (layer)",
    "integration: two or more components through a real resource (layer)",
    "repository: checks on the repository's own files; no package code runs (layer)",
]

# Coverage of the package (src/traceconomics) by the pytest suite, in CI's python and python-local
# jobs, combined in the badges job; tests/coverage/overview.py splits it by layer.
[tool.coverage.run]
branch = true
source_pkgs = ["traceconomics"]
# Paths relative to the checkout, so the two jobs' data files combine.
relative_files = true
# The layer each line ran under is recorded as a dynamic context (tests/conftest.py switches it):
# the C tracer records contexts, the sys.monitoring core does not.
core = "ctrace"

# One code style for the Python code, set by Ruff and checked in CI (`ruff format --check`, `ruff check`).
[tool.ruff]
# The code was written to about this width; Ruff's default (88) would rewrap far more of it.
line-length = 120
target-version = "py314"
# Only the project's own code. Listed, not left to .gitignore, so that local scripts kept elsewhere in
# a checkout are never in scope.
include = ["src/**/*.py", "tests/**/*.py", ".github/scripts/**/*.py"]
# Saved publisher files are never rewritten (tests/fixtures/README.md); force-exclude keeps them out
# even when a path inside is passed on the command line.
extend-exclude = ["tests/fixtures"]
force-exclude = true

[tool.ruff.lint]
# Ruff's defaults (pyflakes, pycodestyle errors) plus import order, likely bugs and upgrades to the
# Python this project runs. Add rules one at a time, each in its own change.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These files import shared pytest fixtures (from tests/clitools.py); a test takes a fixture by
# naming it as an argument, which shadows the import on purpose.
"tests/test_cli.py" = ["F811"]
"tests/test_cli_local.py" = ["F811"]

[tool.ruff.lint.isort]
# Keep `from x import a, b as c` on one line, as the code writes it (one noqa covers the line).
combine-as-imports = true

[tool.coverage.html]
# Each line's layers, shown in the HTML report.
show_contexts = true
