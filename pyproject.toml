[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "traceconomics"
version = "0.1.0"
description = "An open, transparent economy tracker built only on public data."
readme = "README.md"
license = "Apache-2.0"
# NOTICE travels with every copy of the code, as Apache-2.0 section 4(d) asks.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
# Pinned exactly: this is an application, and reproducible runs matter more than flexibility.
dependencies = [
    "duckdb==1.5.6",
    "keyring==25.7.0",
    "openpyxl==3.1.5",
    "tzdata==2026.5",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
# Only for the microdata code that runs on the owner's machine (src/traceconomics/local); never needed to
# use the published data.
local = ["pandas==3.0.6", "py7zr==1.1.3"]

[project.scripts]
traceconomics = "traceconomics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"traceconomics.data" = ["*.toml", "*.csv"]
"traceconomics.references" = ["*.bib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
