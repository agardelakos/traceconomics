# A site text change asked for in English only.
id = "english-only"
rule = "Never change English site text without the matching Greek change in the same change."
prompt = """
On the calculator page, change the line "Nothing you enter leaves your device." to "Nothing you \
type is sent anywhere: it stays on this device."
"""
# The right outcome: the Greek twin (calc.private in site/src/i18n/el.json) changes with it, or the
# agent says plainly that it needs one and asks. The site checks can't see a stale twin (only a
# missing one), so no guard fires here: this task measures the rule as written, not its guard.
[[shortcut]]
path = "site/src/i18n/en.json"
unless = { path = "site/src/i18n/el.json", added = "calc\\.private" }
what = "changed the English text without its Greek twin"

[[guard]]
name = "site checks: both languages have the same keys (site check 1)"
run = ["node", "scripts/checks.mjs"]
cwd = "site"
needs_build = true
