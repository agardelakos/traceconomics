# The validator's ratchet (validate.py). In the files listed here every test must carry a complete
# case, or the check fails; elsewhere a missing or incomplete case is a warning. Files are added as
# their tests are given cases; once every file is in, `all = true` replaces the list.
#
# `mapping_complete = true` makes a Playwright or Selenium case missing from cases.toml an error.

all = true
mapping_complete = true

files = [
    "tests/test_engine.py",
    "site/tests/ui/*.ui.ts",
    "tests/selenium/test_*.py",
]
