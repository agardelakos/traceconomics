# The cross-suite mapping: one shared case, the Playwright and Selenium cases that implement it.
#
# Each browser suite names only its own cases, so this file is the one place that links them. Each entry: a TC-<AREA>-NNN key, a one-line title, and the IDs
# per suite. A case in one suite only says why. IDs here are never reused.
#
# [TC-CALC-001]
# title = "the calculator, left untouched, shows the published series' latest rate"
# playwright = ["PW-CALC-001"]
# selenium = ["SEL-CALC-001"]
#
# [TC-HOST-004]
# title = "…"
# playwright = ["PW-HOST-004"]
# why = "needs a browser API Selenium doesn't expose"

[TC-CALC-001]
title = "untouched, the calculator shows the published series' latest rate"
playwright = ["PW-CALC-001"]
selenium = ["SEL-CALC-001"]

[TC-CALC-002]
