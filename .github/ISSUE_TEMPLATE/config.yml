# Every issue starts from a form, so each report carries what is needed to act on it.
blank_issues_enabled: false
contact_links:
  - name: Security problem
    url: https://github.com/agardelakos/traceconomics/security/advisories/new
    about: Report a vulnerability privately, never in a public issue. See SECURITY.md.
  - name: Code of conduct concern
    url: https://github.com/agardelakos/traceconomics/blob/main/CODE_OF_CONDUCT.md
    about: Report it privately by email, as the code of conduct explains, not in an issue.
