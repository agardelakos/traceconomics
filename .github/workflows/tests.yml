# The tests, on every push and pull request: one run per push, reading as one pipeline. The suites
# (python, python-local, site, selenium) and the code scan (codeql) run side by side; then the test
# catalog's check, the run's record on the branch test-history, and the wiki, which follows from both.
#
# The website's build, its calculator parity test and its browser tests need the published data
# files, which are generated from the raw archive and are not in the repository. Here the site
# runs on made-up data instead (`tests/sitedata.py`), written by the real export code, so the files
# have the real format: the full `npm run check`, then the browser tests, with one coverage count
# for both (and, on main, the README's badge).
#
# The optional microdata dependencies are never installed here: those tests skip themselves.
# Actions are pinned to a full commit (the tag is in the comment), and the token is read-only,
# except in the jobs badges and test-history (below), each writing to its own branch only.

name: tests

on:
  push:
    branches: [main]      # other branches are tested through their pull request
  pull_request:
  # Weekly, so the code scan sees new CodeQL queries even in a quiet week (the tests run too).
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event too: the weekly run must never cancel a push's run. Only a pull request's runs cancel
  # each other (a new commit makes the old run moot); pushes to main queue, so every one is recorded.
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Only what the lock file lists, each file checked against its hash; then the project itself,
      # built with the locked setuptools (build isolation would fetch an unchecked one).
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      # JUnit XML for the run history (tests/catalog/history.py): each result, given to its case.
      - run: python -I -m pytest -ra --junitxml=${{ runner.temp }}/pytest.xml
      - name: Upload the results file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: ${{ runner.temp }}/pytest.xml
          retention-days: 7
          if-no-files-found: ignore

  # The microdata code's tests (groups, bands, bootstrap, mapping, the survey reader), on synthetic
  # surveys: they need the optional `local` extra (pandas, py7zr), which the python job leaves out
  # on purpose. Two jobs, two proofs: python shows the package outside local/ runs without pandas;
  # this one runs every test file that would skip itself without it. Never real microdata.
  python-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The dev lock (pytest), then the local one (pandas, py7zr); the two pin the same versions where
      # they overlap.
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements-local.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      # Every file with a test that needs the extra, found here rather than listed, so a new one is
      # never left out.
      - run: python -I -m pytest -ra --junitxml=${{ runner.temp }}/pytest-local.xml $(grep -l importorskip tests/*.py)
      - name: Upload the results file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-local-results
          path: ${{ runner.temp }}/pytest-local.xml
          retention-days: 7
          if-no-files-found: ignore

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python only to write the made-up data, installed as in the python job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
        working-directory: .
      - run: python -m pip install --no-deps --no-build-isolation -e .
        working-directory: .
      - run: python tests/sitedata.py site/public/data
        working-directory: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Reuses downloaded packages between runs (keyed on the lockfile): fewer downloads, fewer
          # failures from a dropped connection to the registry.
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        env:
          npm_config_fetch_retries: "5"
      # A coverage build (source maps, Vitest's coverage): this build is never published.
      - run: npm run check
        env:
          TRACECONOMICS_COVERAGE: "on"
      # Playwright's own Chromium, the version the locked Playwright expects, with its system libraries.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
        env:
          TRACECONOMICS_COVERAGE: "on"
      # One count from both suites: coverage/summary.json and an HTML report. Fails if a file of the
      # site's own code is loaded by no test at all (it would otherwise drop out of the count).
      - name: Coverage
        if: ${{ !cancelled() }}
        run: node scripts/coverage.mjs --strict
      - name: Coverage badge
        if: ${{ !cancelled() }}
        run: node scripts/badge.mjs coverage/badge/coverage-site.svg
      # On the run's page: both suites' results, each failure named, and the coverage; also after a failure.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs
      # The coverage report, on every run, kept 7 days. Made-up data only.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-coverage
          path: site/coverage/report/
          retention-days: 7
          if-no-files-found: ignore
      # The browser tests' HTML report on every run, kept 7 days: every test with its result and
      # time, and for a failure its screenshot, console errors and trace. Made-up data only.
      - name: Upload the browser test's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-report
          path: site/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      # Vitest's results file (vitest.config.ts writes it on every run): the catalog reads each test's
      # case from it, the run history its result.
      - name: Upload the unit tests' results file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-results
          path: site/test-reports/vitest.json
          retention-days: 7
          if-no-files-found: ignore
      # Playwright's results file alone (small), for the comparison with Selenium below.
      - name: Upload the browser test's results file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: site/test-reports/playwright.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload the coverage badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge
          path: site/coverage/badge/
          retention-days: 1
          if-no-files-found: error

  # The same site tested a second way, with Python and Selenium on Chrome (tests/selenium), to
  # compare the two tools. Same made-up data, a plain build (no coverage). Not a required check.
  selenium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The Selenium lock: base, dev and the selenium extra, each file checked against its hash.
      - run: python -m pip install --require-hashes --no-deps -r requirements-selenium.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tests/sitedata.py site/public/data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Node only to build the site; axe-core for the accessibility tests comes from these packages too.
      - run: npm ci --no-audit
        working-directory: site
        env:
          npm_config_fetch_retries: "5"
      - run: npm run build
        working-directory: site
      # Ubuntu 24.04 can stop programs outside the usual install folders from building Chrome's
      # sandbox (AppArmor's restriction on unprivileged user namespaces), and Chrome for Testing lives
      # in ~/.cache. Allowed here rather than running Chrome without its sandbox. Then the pinned
      # Chrome is fetched and started once on its own, so a Chrome that can't start says why.
      - name: Chrome starts
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -I tests/selenium/chrome.py
      - run: python -I -m pytest tests/selenium --selenium -n auto -ra --junitxml=site/selenium-report/junit.xml
      # On the run's page: passed, failed, skipped, each failure, per file; also after a failure.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: python -I tests/compare/report.py selenium site/selenium-report/junit.xml
      # Every test with its time (JUnit XML) and, for a failure, a screenshot, the page and the console.
      - name: Upload the Selenium report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selenium-report
          path: site/selenium-report/
          retention-days: 7
          if-no-files-found: ignore

  # Both suites' results from this run side by side on the run's page, also when one of them failed.
  # Only the result files are read (no code from the branch beyond the report script).
  compare:
    needs: [site, selenium]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # A suite that never ran has no file: the report says so instead of the job failing here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: playwright-results
          path: results/playwright
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: selenium-report
          path: results/selenium
      - name: Comparison
        run: python -I tests/compare/report.py compare results/playwright/playwright.json results/selenium/junit.xml

  # The test catalog (tests/catalog/): every case of the four suites, read from the tests, and the
  # check that each is well formed. A ratchet: the files tests/catalog/strict.toml lists must be
  # complete, the rest only warn until their turn; IDs that clash or were used before always fail.
  # Collecting needs every suite's tooling (the Selenium lock is a superset of the dev one), the
  # made-up data (Playwright's specs read it while they are listed), a built site (some Selenium
  # tests are parametrized from its sitemap) and Vitest's results file.
  catalog:
    needs: [site]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-selenium.txt
      # The microdata code's tests skip their whole module without pandas, so pytest would never see
      # them: the local lock too (same pins where the two overlap). Only this job installs it; the
      # python job leaves it out on purpose, to prove the rest of the code doesn't need it.
      - run: python -m pip install --require-hashes --no-deps -r requirements-local.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tests/sitedata.py site/public/data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        working-directory: site
        env:
          npm_config_fetch_retries: "5"
      # Some tests in both browser suites are made one per page of the built site (its sitemap), so
      # listing them needs a build first. A plain one: nothing here is published.
      - run: npm run build
        working-directory: site
      # Listing loads the specs without starting a browser or the server.
      - run: npx playwright test --list --reporter=json > "$RUNNER_TEMP/playwright-list.json"
        working-directory: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vitest-results
          path: ${{ runner.temp }}/vitest
      - run: >
          python -I tests/catalog/collect.py --out "$RUNNER_TEMP/catalog/catalog.json"
          --playwright "$RUNNER_TEMP/playwright-list.json" --vitest "$RUNNER_TEMP/vitest/vitest.json"
      - name: Upload the catalog
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog/catalog.json
          retention-days: 7
          if-no-files-found: error
      # Last, so the catalog is kept even when a case is wrong. The obsolete IDs come from the run
      # history: a removed test's ID can never come back.
      - name: Check the cases
        run: |
          set -o pipefail      # the validator's exit code, not tee's
          git fetch -q --depth 1 origin test-history 2>/dev/null \
            && git show FETCH_HEAD:obsolete.json > "$RUNNER_TEMP/obsolete.json" || echo '{}' > "$RUNNER_TEMP/obsolete.json"
          python -I tests/catalog/validate.py "$RUNNER_TEMP/catalog/catalog.json" --require-all --quiet \
            --obsolete "$RUNNER_TEMP/obsolete.json" | tee -a "$GITHUB_STEP_SUMMARY"

  # Every push to main's test run, recorded against its commit on the branch `test-history`
  # (tests/catalog/history.py): each case's result, duration and retries; failures included, so it
  # runs whatever the tests did. Pull requests are never recorded. The only other job that writes
  # to the repository, and only to that branch, which it appends to and never force-pushes.
  test-history:
    needs: [python, python-local, site, selenium, catalog]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    # No concurrency group: GitHub keeps one pending job per group and cancels the older one,
    # which would drop a run's record. The push script retries on a lost race instead.
    steps:
      # The whole history: the push script checks that this commit descends from the stored
      # catalog's before replacing it, so a re-run of an old run never rolls the catalog back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # A suite that never ran has no file: it is left out of the record, not a reason to stop.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "{pytest-results,pytest-local-results,vitest-results,playwright-results,selenium-report,catalog}"
          path: ${{ runner.temp }}/results
      - name: The run's record
        env:
          R: ${{ runner.temp }}/results
        run: |
          args=()
          [ -f "$R/pytest-results/pytest.xml" ] && args+=(--junit "pytest=$R/pytest-results/pytest.xml")
          [ -f "$R/pytest-local-results/pytest-local.xml" ] && args+=(--junit "pytest-local=$R/pytest-local-results/pytest-local.xml")
          [ -f "$R/selenium-report/junit.xml" ] && args+=(--junit "selenium=$R/selenium-report/junit.xml")
          [ -f "$R/playwright-results/playwright.json" ] && args+=(--playwright "$R/playwright-results/playwright.json")
          [ -f "$R/vitest-results/vitest.json" ] && args+=(--vitest "$R/vitest-results/vitest.json")
          # Without the catalog (its job failed) the run is still recorded: Playwright's and Vitest's
          # results carry their own IDs; pytest's and Selenium's count as tests without a case.
          catalog="$R/catalog/catalog.json"
          if [ ! -f "$catalog" ]; then
            echo "::warning::No catalog from this run: pytest and Selenium results are recorded without their cases."
            catalog="$RUNNER_TEMP/empty-catalog.json"; echo '{"cases": []}' > "$catalog"
          fi
          python -I tests/catalog/history.py record --catalog "$catalog" --out "$R/record.json" \
            --trigger push --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --env platform=linux-x86_64 --env runner=ubuntu-24.04 --env data=made-up "${args[@]}"
      - name: Push the record to the branch test-history
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOG_OK: ${{ needs.catalog.result == 'success' }}
        run: |
          # The stored catalog (and with it the obsolete IDs) moves only on a catalog whose check
          # passed: an incomplete or broken one would make live IDs look removed.
          catalog=()
          [ "$CATALOG_OK" = true ] && [ -f "$RUNNER_TEMP/results/catalog/catalog.json" ] \
            && catalog=(--catalog "$RUNNER_TEMP/results/catalog/catalog.json")
          .github/scripts/test_history_push.sh "Run $GITHUB_RUN_ID on ${GITHUB_SHA::7}" \
            "$RUNNER_TEMP/results/record.json" "${catalog[@]}"

  # Code scanning (CodeQL), one job per language, the same languages and categories as GitHub's
  # default setup used before (so earlier alerts and their dismissals carry over). Nothing to build:
  # Python, TypeScript and the workflow files are analysed from source. Its results are a required
  # check of the main branch's ruleset.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # The wiki (wiki.yml): the hand-written pages from wiki/ and the generated Tests pages, after this
  # run's record is stored. wiki.yml also runs daily on its own, for the release builds' runs.
  wiki:
    needs: [test-history]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: ./.github/workflows/wiki.yml
    secrets: inherit

  # The README's coverage badge, after a push to main whose tests passed. The badge is the only
  # file on the branch `badges`, kept as a single commit (force-pushed), so its history never grows.
  # The only job that may write to the repository, and only to that branch.
  badges:
    needs: [python, site]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: badge
      - name: Push the badge to the branch badges
        working-directory: badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-site.svg
          git commit -q -m "Coverage badge for ${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push -q --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" badges:badges
