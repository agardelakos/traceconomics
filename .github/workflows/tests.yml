# The pipeline, on every push and pull request: one run per push. The suites (python, python-local,
# site, and the site again on each other data state, data-states), the style check (lint) and the
# code scan (codeql) run side by side; then the coverage split by layer and the test catalog's check;
# on main, the README's coverage badges.
#
# The website's build, its calculator parity test and its browser tests need the published data
# files, which are generated from the raw archive and are not in the repository. Here the site
# runs on made-up data instead (`tests/sitedata.py`), written by the real export code, so the files
# have the real format: the full `npm run check`, then the browser tests, with one coverage count
# for both (and, on main, the README's front-end badge).
#
# The optional microdata dependencies are never installed here: those tests skip themselves.
# Actions are pinned to a full commit (the tag is in the comment), and the token is read-only,
# except in the job badges (below), which writes to its own branch only.
#
# This is the core: what the project needs and contributors keep green. The maintainer's testing
# showcase (the Selenium suite, the two browser suites compared, the code map, the run's record on
# the branch test-history and the wiki that follows from it, mutation testing) is in showcase.yml,
# which starts after every run of this workflow on main and reads its artifacts; it never runs on a
# pull request and is never a required check.

# Named for what the run is, all of it, not just its tests: the README's status badge shows this name.
name: pipeline

on:
  push:
    branches: [main]      # other branches are tested through their pull request
  pull_request:
  # Weekly, so the code scan sees new CodeQL queries even in a quiet week (the tests run too).
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event too: the weekly run must never cancel a push's run. Only a pull request's runs cancel
  # each other (a new commit makes the old run moot); pushes to main queue, so every one is recorded.
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Only what the lock file lists, each file checked against its hash; then the project itself,
      # built with the locked setuptools (build isolation would fetch an unchecked one).
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      # JUnit XML for the run history (tests/catalog/history.py): each result, given to its case.
      # Measured by coverage.py (settings in pyproject.toml); each line labelled with its test's layer.
      - run: python -I -m coverage run -m pytest -ra --junitxml=${{ runner.temp }}/pytest.xml
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage-python
      - name: Upload the results file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-results
          path: ${{ runner.temp }}/pytest.xml
          retention-days: 7
          if-no-files-found: ignore
      # The coverage data, combined with python-local's in the coverage job.
      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-python
          path: ${{ runner.temp }}/coverage-python
          retention-days: 1
          if-no-files-found: error

  # One code style: Ruff for the Python, Prettier and ESLint for the site, its Markdown and the wiki.
  # Check mode only, so a run fails on unformatted code and never rewrites it; settings in
  # pyproject.toml and site/ (.prettierrc.json, .prettierignore, eslint.config.mjs).
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Ruff from the lock file, checked against its hash; the project itself isn't needed.
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: ruff format --check
      - run: ruff check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        working-directory: site
        env:
          npm_config_fetch_retries: "5"
      - run: npm run format:check
        working-directory: site
      - run: npm run lint
        working-directory: site

  # The microdata code's tests (groups, bands, bootstrap, mapping, the survey reader), on synthetic
  # surveys: they need the optional `local` extra (pandas, py7zr), which the python job leaves out
  # on purpose. Two jobs, two proofs: python shows the package outside local/ runs without pandas;
  # this one runs every test file that would skip itself without it. Never real microdata.
  python-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The dev lock (pytest), then the local one (pandas, py7zr); the two pin the same versions where
      # they overlap.
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip install --require-hashes --no-deps -r requirements-local.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      # Every file with a test that needs the extra, found here rather than listed, so a new one is
      # never left out.
      - run: |
          mapfile -t files < <(grep -l importorskip tests/*.py)
          python -I -m coverage run -m pytest -ra --junitxml="$RUNNER_TEMP/pytest-local.xml" "${files[@]}"
        env:
          COVERAGE_FILE: ${{ runner.temp }}/coverage-local
      - name: Upload the results file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-local-results
          path: ${{ runner.temp }}/pytest-local.xml
          retention-days: 7
          if-no-files-found: ignore
      # The microdata code's coverage: measured from python alone, src/traceconomics/local would read
      # near 0%.
      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-local
          path: ${{ runner.temp }}/coverage-local
          retention-days: 1
          if-no-files-found: error

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python only to write the made-up data, installed as in the python job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
        working-directory: .
      - run: python -m pip install --no-deps --no-build-isolation -e .
        working-directory: .
      - run: python tests/sitedata.py site/public/data
        working-directory: .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Reuses downloaded packages between runs (keyed on the lockfile): fewer downloads, fewer
          # failures from a dropped connection to the registry.
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        env:
          npm_config_fetch_retries: "5"
      # A coverage build (source maps, Vitest's coverage): this build is never published.
      - run: npm run check
        env:
          TRACECONOMICS_COVERAGE: "on"
      # The unit tests again, alone, for the split by layer (scripts/coverage.mjs): a line the full
      # Vitest run covers but this one doesn't is one only the integration tests reach. Their results
      # go beside their coverage, so the run's results file (test-reports/vitest.json) stays the full run's.
      - run: >-
          npx vitest run --exclude src/lib/engine/parity.test.ts --exclude src/lib/data-files.test.ts
          --outputFile.json=coverage/vitest-unit/results.json
        env:
          TRACECONOMICS_COVERAGE: "on"
          TRACECONOMICS_COVERAGE_DIR: coverage/vitest-unit
      # Playwright's own Chromium, the version the locked Playwright expects, with its system libraries.
      - run: npx playwright install --with-deps chromium
      # TRACECONOMICS_CODE_MAP: each test's own coverage too, for the code map (below).
      - run: npm run test:ui
        env:
          TRACECONOMICS_COVERAGE: "on"
          TRACECONOMICS_CODE_MAP: "on"
      # One count from both suites, and its split by layer: coverage/summary.json and an HTML report.
      # Fails if a file of the site's own code is loaded by no test at all (it would otherwise drop
      # out of the count), or below the floor.
      - name: Coverage
        if: ${{ !cancelled() }}
        run: node scripts/coverage.mjs --strict
      # The front end's part of the wiki's code map (scripts/code-map-lines.mjs): every line with
      # code, each layer's lines, what the build bundles, each Vitest file run alone, each Playwright
      # case. Not a check: the map is showcase work, so a failure here never fails the job.
      - name: The code map's lines
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          node scripts/code-map-lines.mjs lines
          node scripts/code-map-lines.mjs vitest
          node scripts/code-map-lines.mjs playwright
      - name: Upload the code map's lines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-code-map
          path: site/coverage/code-map/
          retention-days: 1
          if-no-files-found: ignore
      # On the run's page: both suites' results, each failure named, and the coverage; also after a failure.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs
      # The coverage report, on every run, kept 7 days. Made-up data only.
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-coverage
          path: site/coverage/report/
          retention-days: 7
          if-no-files-found: ignore
      # The browser tests' HTML report on every run, kept 7 days: every test with its result and
      # time, and for a failure its screenshot, console errors and trace. Made-up data only.
      - name: Upload the browser test's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-report
          path: site/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      # Vitest's results file (vitest.config.ts writes it on every run): the catalog reads each test's
      # case from it, the run history its result.
      - name: Upload the unit tests' results file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-results
          path: site/test-reports/vitest.json
          retention-days: 7
          if-no-files-found: ignore
      # Playwright's results file alone (small): for the run record and the comparison with
      # Selenium, in showcase.yml.
      - name: Upload the browser test's results file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: site/test-reports/playwright.json
          retention-days: 7
          if-no-files-found: ignore
      # The count and its split, for the coverage job's front-end badge.
      - name: Upload the coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-coverage-summary
          path: site/coverage/summary.json
          retention-days: 1
          if-no-files-found: error

  # Both coverage figures split by layer (tests/coverage/overview.py): the Python package's, from
  # both pytest jobs combined, and the site's, from its summary. On every run: the split on the run's
  # page and the Python HTML report (each line's layers and tests shown); on main, the badges for the
  # job below.
  # The Python figure fails below its ratchet (tests/coverage/overview.py, RATCHET), which rises to
  # the site's 90% floor as tests are added; the site's floor is enforced in the site job.
  coverage:
    needs: [python, python-local, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: ${{ runner.temp }}/coverage-data
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-coverage-summary
          path: ${{ runner.temp }}/site-coverage
      # The paths in both data files are relative to the checkout (relative_files), so they combine
      # here against this checkout's sources.
      - run: python -I -m coverage combine --keep ${{ runner.temp }}/coverage-data/coverage-python ${{ runner.temp }}/coverage-data/coverage-local
      - run: python -I -m coverage html --directory ${{ runner.temp }}/python-coverage --title "Back-end coverage"
      - name: Split by layer
        run: |
          set -o pipefail      # the script's exit code, not tee's
          python -I tests/coverage/overview.py --python .coverage \
            --site "$RUNNER_TEMP/site-coverage/summary.json" --out "$RUNNER_TEMP/badges" --strict \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: ${{ runner.temp }}/python-coverage/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload the badges
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badges
          path: ${{ runner.temp }}/badges/*.svg
          retention-days: 1
          if-no-files-found: error

  # Real data pass through a few states every month and year: the HICP a month behind the CPI
  # (the site job above), the HICP caught up, a new year's January, a new survey year. The site and
  # the Playwright suite run on each of the others, so a page or a test that works in one state only
  # fails here, not on a release day (two release builds failed that way in 2026-11). The showcase's
  # Selenium suite runs on every state too, in showcase.yml.
  # A plain build, no coverage: the counts come from the site job.
  data-states:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        state: [hicp-caught-up, january, new-survey]
    name: data state (${{ matrix.state }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tests/sitedata.py site/public/data --state ${{ matrix.state }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        working-directory: site
        env:
          npm_config_fetch_retries: "5"
      # Type check, unit tests, build and the site checks, on this state's data.
      - run: npm run check
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:ui
        working-directory: site
      # The browser test's report, for a failure: screenshots and traces.
      - name: Upload the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-state-${{ matrix.state }}-reports
          path: site/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The site built on two made-up data sets with the same pages and other numbers: a figure that
  # reads the same in both was typed into a page or component, not taken from the data
  # (site/src/lib/same-in-both.mjs).
  same-in-both:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        working-directory: site
        env:
          npm_config_fetch_retries: "5"
      - name: Build on each data set
        run: |
          for values in a b; do
            rm -rf site/public/data
            python tests/sitedata.py site/public/data --values "$values"
            (cd site && npm run build)
            mv site/dist "site/dist-$values"
          done
      - run: node scripts/same-in-both.mjs dist-a dist-b
        working-directory: site

  # The test catalog (tests/catalog/): every case of the four suites, read from the tests, and the
  # check that each is well formed. A ratchet: the files tests/catalog/strict.toml lists must be
  # complete, the rest only warn until their turn; IDs that clash or were used before always fail.
  # Collecting needs every suite's tooling (the Selenium lock is a superset of the dev one), the
  # made-up data (Playwright's specs read it while they are listed), a built site (some Selenium
  # tests are parametrized from its sitemap) and Vitest's results file. Selenium's cases are only
  # collected here, never run: the suite runs in showcase.yml. A Playwright case the cross-suite
  # mapping doesn't list only warns (tests/catalog/validate.py): the maintainer maps it.
  catalog:
    needs: [site]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-selenium.txt
      # The microdata code's tests skip their whole module without pandas, so pytest would never see
      # them: the local lock too (same pins where the two overlap). Only this job installs it; the
      # python job leaves it out on purpose, to prove the rest of the code doesn't need it.
      - run: python -m pip install --require-hashes --no-deps -r requirements-local.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tests/sitedata.py site/public/data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        working-directory: site
        env:
          npm_config_fetch_retries: "5"
      # Some tests in both browser suites are made one per page of the built site (its sitemap), so
      # listing them needs a build first. A plain one: nothing here is published.
      - run: npm run build
        working-directory: site
      # Listing loads the specs without starting a browser or the server.
      - run: npx playwright test --list --reporter=json > "$RUNNER_TEMP/playwright-list.json"
        working-directory: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vitest-results
          path: ${{ runner.temp }}/vitest
      - run: >
          python -I tests/catalog/collect.py --out "$RUNNER_TEMP/catalog/catalog.json"
          --playwright "$RUNNER_TEMP/playwright-list.json" --vitest "$RUNNER_TEMP/vitest/vitest.json"
      - name: Upload the catalog
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog/catalog.json
          retention-days: 7
          if-no-files-found: error
      # Last, so the catalog is kept even when a case is wrong. The obsolete IDs come from the run
      # history: a removed test's ID can never come back.
      - name: Check the cases
        run: |
          set -o pipefail      # the validator's exit code, not tee's
          git fetch -q --depth 1 origin test-history 2>/dev/null \
            && git show FETCH_HEAD:obsolete.json > "$RUNNER_TEMP/obsolete.json" || echo '{}' > "$RUNNER_TEMP/obsolete.json"
          python -I tests/catalog/validate.py "$RUNNER_TEMP/catalog/catalog.json" --require-all --quiet \
            --obsolete "$RUNNER_TEMP/obsolete.json" | tee -a "$GITHUB_STEP_SUMMARY"

  # Code scanning (CodeQL), one job per language, the same languages and categories as GitHub's
  # default setup used before (so earlier alerts and their dismissals carry over). Nothing to build:
  # Python, TypeScript and the workflow files are analysed from source. Its results are a required
  # check of the main branch's ruleset.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  # The README's coverage badges, after a push to main whose tests passed. The badges are the only
  # files on the branch `badges`, kept as a single commit (force-pushed), so its history never grows.
  # The only job that may write to the repository, and only to that branch.
  badges:
    needs: [coverage]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badges
          path: badge
      - name: Push the badge to the branch badges
        working-directory: badge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-back-end.svg coverage-front-end.svg
          git commit -q -m "Coverage badges for ${GITHUB_SHA}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push -q --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" badges:badges
