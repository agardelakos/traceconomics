# The tests, on every push and pull request.
#
# The website's build, its calculator parity test and its browser tests need the published data
# files, which are generated from the raw archive and are not in the repository. Here the site
# runs on made-up data instead (`tests/sitedata.py`), written by the real export code, so the files
# have the real format: the full `npm run check`, then the browser smoke test.
#
# The optional microdata dependencies are never installed here: those tests skip themselves.
# Actions are pinned to a full commit (the tag is in the comment), and the token is read-only.

name: tests

on:
  push:
    branches: [main]      # other branches are tested through their pull request
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Only what the lock file lists, each file checked against its hash; then the project itself,
      # built with the locked setuptools (build isolation would fetch an unchecked one).
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -I -m pytest -ra

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python only to write the made-up data, installed as in the python job.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
        working-directory: .
      - run: python -m pip install --no-deps --no-build-isolation -e .
        working-directory: .
      - run: python tests/sitedata.py site/public/data
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # Reuses downloaded packages between runs (keyed on the lockfile): fewer downloads, fewer
          # failures from a dropped connection to the registry.
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        env:
          npm_config_fetch_retries: "5"
      - run: npm run check
      # Playwright's own Chromium, the version the locked Playwright expects, with its system libraries.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      # On the run's page: both suites' results, each failure named; also after a failure.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: node scripts/test-summary.mjs
      # Only when something failed: the browser test's HTML report (screenshots, console errors,
      # traces), kept 7 days. Made-up data only, so nothing in it is private.
      - name: Upload the browser test's report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-report
          path: site/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
