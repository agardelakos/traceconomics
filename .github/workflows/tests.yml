# The tests, on every push and pull request.
#
# The website's build and its calculator parity test need the published data files, which are
# generated from the raw archive and are not in the repository. Here the site gets its type check
# and unit tests; the full `npm run check` runs where the data exist.
#
# The optional microdata dependencies are never installed here: those tests skip themselves.
# Actions are pinned to a full commit (the tag is in the comment), and the token is read-only.

name: tests

on:
  push:
    branches: [main]      # other branches are tested through their pull request
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Only what the lock file lists, each file checked against its hash; then the project itself,
      # built with the locked setuptools (build isolation would fetch an unchecked one).
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -I -m pytest -ra

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # Reuses downloaded packages between runs (keyed on the lockfile): fewer downloads, fewer
          # failures from a dropped connection to the registry.
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        env:
          npm_config_fetch_retries: "5"
      - run: npm run check:code
