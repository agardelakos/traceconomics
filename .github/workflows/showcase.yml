# The testing showcase: the maintainer's testing portfolio, apart from the core in tests.yml. Never
# a required check, never a release step, never run on a pull request, and nothing a contributor has
# to run or keep green; a showcase test a change breaks is the maintainer's to follow up.
#
# After every run of the pipeline (tests.yml) on a push to main, whatever its result:
#
#  - selenium: the Selenium suite on the made-up data, in each data state the pipeline runs
#    Playwright on; the default state in a coverage build, for the code map.
#  - compare-main: this run's Selenium results beside the pipeline run's Playwright results.
#  - code-map: the pipeline's Python coverage and the site's lines, with Selenium's.
#  - test-history: the run's record on the branch test-history (the pipeline's results and
#    Selenium's, against the pipeline run), and the code map; then the wiki (wiki.yml).
#
# The jobs download that pipeline run's artifacts: only runs of pushes to main, never a pull
# request's, so nothing here reads files a review hasn't passed. They check out main's head, not the
# commit named by the event, so no code from an event's payload runs with main's rights (and its
# cache); they run only while main's head is still the commit the pipeline ran on. If a newer push
# landed first, they skip and job "newer-commit" says so: that push's own pipeline run starts the
# next showcase run, and the older commit has no Selenium run or record.
#
# Weekly: the Selenium suite alone on main, so a change outside the repository (a new Chrome for
# Testing, a dependency) shows even in a week with no push.
#
# By hand, from the Actions tab ("Run workflow"), one or both of the runs too long for every push:
#
#  - compare: the two browser suites, Playwright and Selenium, compared fairly: several runs each, on
#    one runner, the same build of made-up data (`tests/sitedata.py`) and the same number of workers.
#    Flaky tests (failed in some runs, passed in others) show up only over several runs. Playwright
#    runs with its --fully-parallel flag, spreading single tests over the workers as pytest-xdist
#    does. With every mode on, about one and a half to two hours for 5 runs (UNVERIFIED estimate from
#    the desktop's times). The result is the run's artifact `comparison`.
#  - mutation: mutation testing of the engine (src/traceconomics/engine): mutmut changes the engine's
#    code in small ways, one at a time, and runs the tests that run the engine (taken from the code
#    map on the branch test-history) on each change; a change no test notices is a survivor
#    (tests/coverage/mutation.py). About 9 minutes (8 min 52 s for 269 changes on the runner's 4
#    workers, 2026-11-24). On main, the result is stored on test-history (mutation.json, replacing the
#    previous one, and a line per run in mutation-history.jsonl) and the wiki is updated, where the
#    page Tests-Mutation shows the score over time and the survivors; on another branch it is only the
#    run's artifact `mutation`, so it never stands for code that isn't on main.
#
# Actions are pinned to a full commit (the tag is in the comment).

name: showcase

on:
  workflow_dispatch:
    inputs:
      run:
        description: "What to run"
        type: choice
        options: [both, compare, mutation]
        default: both
      runs:
        description: "compare: runs of each suite"
        type: number
        default: 5
      per_file:
        description: "compare: also run both suites by file (a file's tests one after another in one worker): Playwright as configured, Selenium with --dist loadfile"
        type: boolean
        default: true
      sequential:
        description: "compare: also run both suites one test at a time (1 worker): the slowest mode, about half the comparison's time"
        type: boolean
        default: true
  workflow_run:
    workflows: [pipeline]
    types: [completed]
    branches: [main]
  # Mondays, after the pipeline's weekly run (04:17).
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  compare:
    name: "showcase: Playwright and Selenium compared"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run != 'mutation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-selenium.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tests/sitedata.py site/public/data
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit
        working-directory: site
        env:
          npm_config_fetch_retries: "5"
      - run: npm run build
        working-directory: site
      # Both browsers fetched before the first timed run, so no run pays for a download.
      - run: npx playwright install --with-deps chromium
        working-directory: site
      # Ubuntu 24.04 can stop programs outside the usual install folders from building Chrome's
      # sandbox (AppArmor's restriction on unprivileged user namespaces), and Chrome for Testing lives
      # in ~/.cache. Allowed here rather than running Chrome without its sandbox. Then the pinned
      # Chrome is fetched and started once on its own, so a Chrome that can't start says why.
      - name: Chrome starts
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -I tests/selenium/chrome.py
      - name: Compare
        env:
          RUNS: ${{ inputs.runs }}
          PER_FILE: ${{ inputs.per_file }}
          SEQUENTIAL: ${{ inputs.sequential }}
        run: |
          extra=()
          if [ "$PER_FILE" = "true" ]; then extra+=(--per-file); fi
          if [ "$SEQUENTIAL" = "true" ]; then extra+=(--sequential); fi
          python -I tests/compare/compare.py --runs "$RUNS" --workers "$(nproc)" "${extra[@]}" --out comparison.md
      - name: Upload the comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comparison
          path: comparison.md
          retention-days: 30
          if-no-files-found: ignore

  mutation:
    name: "showcase: mutation testing"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run != 'compare' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the branch test-history, on main only
    steps:
      # The whole history: the push script checks that this commit descends from the stored result's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The mutation lock: the dev extra and mutmut, each file checked against its hash.
      - run: python -m pip install --require-hashes --no-deps -r requirements-mutation.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: The engine's tests, from the code map
        run: |
          git fetch -q --depth 1 origin test-history
          git show FETCH_HEAD:code-map.json > "$RUNNER_TEMP/code-map.json" \
            || { echo "::error::No code map on test-history yet: this workflow stores it after each pipeline run on main."; exit 1; }
          python -I tests/coverage/mutation.py select --map "$RUNNER_TEMP/code-map.json"
      - name: Mutation testing
        run: mutmut run --max-children 4
      - name: The result
        run: |
          set -o pipefail      # the script's exit code, not tee's
          python -I tests/coverage/mutation.py report --out "$RUNNER_TEMP/mutation/mutation.json" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation
          path: ${{ runner.temp }}/mutation/mutation.json
          retention-days: 30
          if-no-files-found: error
      - name: Store the result on test-history
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -q -- pyproject.toml   # the test selection written above, back as it was
          .github/scripts/test_history_push.sh "Mutation testing on ${GITHUB_SHA::7}" \
            --mutation "$RUNNER_TEMP/mutation/mutation.json"

  # The wiki, so Code-map-engine shows the new result.
  wiki:
    needs: [mutation]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.mutation.result == 'success' }}
    permissions:
      contents: write
    uses: ./.github/workflows/wiki.yml
    secrets: inherit

  # After a pipeline run on main whose commit is no longer main's head: nothing else runs (see the
  # top of this file), and the run's page says why.
  newer-commit:
    name: "showcase: skipped, main has a newer commit"
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha != github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
          HEAD: ${{ github.sha }}
        run: |
          echo "The pipeline ran on $TESTED, but main is now at $HEAD: skipped. The pipeline run of $HEAD starts the next showcase run." | tee -a "$GITHUB_STEP_SUMMARY"

  # The Selenium suite (tests/selenium), in Python and Selenium on Chrome, to compare the two tools.
  # After a pipeline run on main, on that run's commit (main's head), in every data state (tests/sitedata.py
  # --state); weekly, on main's head. Only the default state is a coverage build with each test's
  # coverage, for the code map, and only its report feeds the comparison and the run record.
  selenium:
    name: "showcase: Selenium (${{ matrix.state }})"
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha) || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        state: [default, hicp-caught-up, january, new-survey]
    env:
      MAP: ${{ matrix.state == 'default' && 'on' || 'off' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The Selenium lock: base, dev and the selenium extra, each file checked against its hash.
      - run: python -m pip install --require-hashes --no-deps -r requirements-selenium.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Made-up data
        env:
          STATE: ${{ matrix.state }}
        run: |
          if [ "$STATE" = default ]; then python tests/sitedata.py site/public/data
          else python tests/sitedata.py site/public/data --state "$STATE"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Node only to build the site; axe-core for the accessibility tests comes from these packages too.
      - run: npm ci --no-audit
        working-directory: site
        env:
          npm_config_fetch_retries: "5"
      # In the default state a coverage build (source maps, nothing else changes), so each test's
      # coverage can be traced back to the site's source files for the code map.
      - run: npm run build
        working-directory: site
        env:
          TRACECONOMICS_COVERAGE: ${{ env.MAP }}
      # Ubuntu 24.04 can stop programs outside the usual install folders from building Chrome's
      # sandbox (AppArmor's restriction on unprivileged user namespaces), and Chrome for Testing lives
      # in ~/.cache. Allowed here rather than running Chrome without its sandbox. Then the pinned
      # Chrome is fetched and started once on its own, so a Chrome that can't start says why.
      - name: Chrome starts
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -I tests/selenium/chrome.py
      # With each test's coverage in the default state, for the code map (tests/selenium/page_coverage.py).
      - run: python -I -m pytest tests/selenium --selenium -n auto -ra --junitxml=site/selenium-report/junit.xml
        env:
          TRACECONOMICS_COVERAGE: ${{ env.MAP }}
          TRACECONOMICS_CODE_MAP: ${{ env.MAP }}
      - name: The code map's lines
        if: ${{ !cancelled() && matrix.state == 'default' }}
        continue-on-error: true
        working-directory: site
        run: node scripts/code-map-lines.mjs selenium coverage/selenium-pertest
      - name: Upload the code map's lines
        if: ${{ !cancelled() && matrix.state == 'default' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selenium-code-map
          path: site/coverage/code-map/selenium.json
          retention-days: 1
          if-no-files-found: ignore
      # On the run's page: passed, failed, skipped, each failure, per file; also after a failure.
      - name: Test summary
        if: ${{ !cancelled() }}
        run: python -I tests/compare/report.py selenium site/selenium-report/junit.xml
      # Every test with its time (JUnit XML) and, for a failure, a screenshot, the page and the console.
      - name: Upload the Selenium report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.state == 'default' && 'selenium-report' || format('selenium-report-{0}', matrix.state) }}
          path: site/selenium-report/
          retention-days: 7
          if-no-files-found: ignore

  # Both suites' results side by side on the run's page, also when one of them failed: Playwright's
  # from the pipeline run, Selenium's from this one. Only the result files are read.
  compare-main:
    name: "showcase: Playwright and Selenium compared (one run)"
    needs: [selenium]
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the pipeline run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # A suite that never ran has no file: the report says so instead of the job failing here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: playwright-results
          path: results/playwright
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: selenium-report
          path: results/selenium
      - name: Comparison
        run: python -I tests/compare/report.py compare results/playwright/playwright.json results/selenium/junit.xml

  # The wiki's code map (tests/coverage/code_map.py): which tests run each module, public function and
  # site file, from the Python coverage of both pytest jobs and the site's lines (the pipeline run's
  # artifacts) and Selenium's (this run's). It waits for the Selenium suite, whatever its result, and
  # a map without Selenium's lines says so. Stored on test-history by the next job.
  code-map:
    name: "showcase: code map"
    needs: [selenium]
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the pipeline run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: ${{ runner.temp }}/coverage-data
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The site's lines and Selenium's, into one folder; either may be missing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: site-code-map
          path: ${{ runner.temp }}/site-code-map
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: selenium-code-map
          path: ${{ runner.temp }}/site-code-map
      # The paths in both data files are relative to the checkout (relative_files), as in the coverage job.
      - run: python -I -m coverage combine --keep ${{ runner.temp }}/coverage-data/coverage-python ${{ runner.temp }}/coverage-data/coverage-local
      - name: The code map
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -o pipefail      # the script's exit code, not tee's
          site=()
          [ -f "$RUNNER_TEMP/site-code-map/lines.json" ] && site=(--site "$RUNNER_TEMP/site-code-map")
          python -I tests/coverage/code_map.py --python .coverage --src src/traceconomics \
            --out "$RUNNER_TEMP/code-map/code-map.json" --commit "$COMMIT" "${site[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the code map
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: code-map
          path: ${{ runner.temp }}/code-map/code-map.json
          retention-days: 7
          if-no-files-found: error

  # The pipeline run's record, on the branch test-history (tests/catalog/history.py): each case's
  # result, duration and retries, from the pipeline's suites and this run's Selenium suite, against
  # the pipeline run's commit, ID and page; failures included, so it runs whatever the tests did.
  # Pull requests are never recorded. Writes only to that branch, which it appends to and never
  # force-pushes.
  test-history:
    name: "showcase: run record"
    needs: [selenium, code-map]
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # the branch test-history
      actions: read # the pipeline run's artifacts and its catalog job's result
    # No concurrency group: GitHub keeps one pending job per group and cancels the older one,
    # which would drop a run's record. The push script retries on a lost race instead.
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      # The whole history: the push script checks that this commit descends from the stored
      # catalog's before replacing it, so a re-run of an old run never rolls the catalog back.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # A suite that never ran has no file: it is left out of the record, not a reason to stop.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "{pytest-results,pytest-local-results,vitest-results,playwright-results,catalog}"
          path: ${{ runner.temp }}/results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: "{selenium-report,code-map}"
          path: ${{ runner.temp }}/results
      - name: The run's record
        env:
          R: ${{ runner.temp }}/results
        run: |
          args=()
          [ -f "$R/pytest-results/pytest.xml" ] && args+=(--junit "pytest=$R/pytest-results/pytest.xml")
          [ -f "$R/pytest-local-results/pytest-local.xml" ] && args+=(--junit "pytest-local=$R/pytest-local-results/pytest-local.xml")
          [ -f "$R/selenium-report/junit.xml" ] && args+=(--junit "selenium=$R/selenium-report/junit.xml")
          [ -f "$R/playwright-results/playwright.json" ] && args+=(--playwright "$R/playwright-results/playwright.json")
          [ -f "$R/vitest-results/vitest.json" ] && args+=(--vitest "$R/vitest-results/vitest.json")
          # Without the catalog (its job failed) the run is still recorded: Playwright's and Vitest's
          # results carry their own IDs; pytest's and Selenium's count as tests without a case.
          catalog="$R/catalog/catalog.json"
          if [ ! -f "$catalog" ]; then
            echo "::warning::No catalog from the pipeline run: pytest and Selenium results are recorded without their cases."
            catalog="$RUNNER_TEMP/empty-catalog.json"; echo '{"cases": []}' > "$catalog"
          fi
          python -I tests/catalog/history.py record --catalog "$catalog" --out "$R/record.json" \
            --trigger push --commit "$COMMIT" --run-id "$RUN_ID-$RUN_ATTEMPT" --run-url "$RUN_URL" \
            --env platform=linux-x86_64 --env runner=ubuntu-24.04 --env data=made-up "${args[@]}"
      - name: Push the record to the branch test-history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The stored catalog (and with it the obsolete IDs) moves only on a catalog whose check
          # passed in the pipeline run: an incomplete or broken one would make live IDs look removed.
          ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "catalog") | .conclusion] | first // ""')
          catalog=()
          [ "$ok" = success ] && [ -f "$RUNNER_TEMP/results/catalog/catalog.json" ] \
            && catalog=(--catalog "$RUNNER_TEMP/results/catalog/catalog.json")
          # The code map, when the code-map job made one: it replaces the stored map.
          map=()
          [ -f "$RUNNER_TEMP/results/code-map/code-map.json" ] && map=(--map "$RUNNER_TEMP/results/code-map/code-map.json")
          .github/scripts/test_history_push.sh "Run $RUN_ID on ${COMMIT::7}" \
            "$RUNNER_TEMP/results/record.json" "${catalog[@]}" "${map[@]}"

  # The wiki (wiki.yml): the hand-written pages from wiki/ and the generated Tests and Code pages,
  # after this run's record is stored. wiki.yml also runs daily on its own, for the release builds'
  # runs.
  wiki-main:
    needs: [test-history]
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha }}
