# Monthly update proposals for the pinned dependencies, one pull request per ecosystem.
# A release must be 14 days old before it is proposed: a broken or hijacked release is usually
# found and pulled within days. Security fixes are not delayed.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      site:
        patterns: ["*"]
