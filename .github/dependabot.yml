# Monthly update proposals for the pinned dependencies, one pull request per ecosystem.
# A release must be 14 days old before it is proposed: a broken or hijacked release is usually
# found and pulled within days. Security fixes are not delayed.
# Major versions are not proposed: they can break compatibility (for example a type checker that
# supports only older TypeScript), so moving to one is a deliberate change. Security fixes still are.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      site:
        patterns: ["*"]
